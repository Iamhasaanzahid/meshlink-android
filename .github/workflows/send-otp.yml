name: Send MeshLink OTP

on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'AES-GCM encrypted OTP payload from the verification worker'
        required: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send verification email
        env:
          OTP_PAYLOAD: ${{ github.event.inputs.payload }}
          OTP_RELAY_SECRET: ${{ secrets.OTP_RELAY_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import base64
          import json
          import os
          import smtplib
          from email.message import EmailMessage
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          key = base64.b64decode(os.environ["OTP_RELAY_SECRET"], validate=True)
          raw = base64.b64decode(os.environ["OTP_PAYLOAD"], validate=True)
          if len(raw) < 13:
              raise SystemExit("invalid payload")
          data = json.loads(AESGCM(key).decrypt(raw[:12], raw[12:], None))

          email = data["email"]
          code = data["code"]
          mesh_id = data["meshId"]
          print(f"::add-mask::{email}")
          print(f"::add-mask::{code}")
          print(f"::add-mask::{mesh_id}")

          msg = EmailMessage()
          msg["From"] = os.environ["SMTP_USER"]
          msg["To"] = email
          msg["Subject"] = "MeshLink verification code"
          msg.set_content(
              f"Your MeshLink verification code is {code}. "
              "It expires in 5 minutes.\n\n"
              "If you did not request this, you can ignore this email."
          )

          host = os.environ.get("SMTP_HOST") or "smtp.gmail.com"
          port = int(os.environ.get("SMTP_PORT") or "587")
          with smtplib.SMTP(host, port, timeout=30) as server:
              server.starttls()
              server.login(os.environ["SMTP_USER"], os.environ["SMTP_PASSWORD"])
              server.send_message(msg)
          print("OTP email sent")
          PY
